name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller
          pip list

      - name: Verify CJK font resolution
        # The v1.3.2 exe shipped with every Chinese label as a tofu box:
        # the font picker accepted pygame's default font, which has no CJK
        # glyphs. Run the font test on the Windows runner BEFORE building --
        # if the runner cannot resolve a Chinese font, the build fails here
        # instead of shipping a broken UI to players.
        run: python tools/test_font_cjk.py

      - name: Build Windows exe
        run: python build.py

      - name: Verify build output
        run: |
          Get-ChildItem dist
          if (Test-Path "dist/HeliOps.exe") { Write-Host "OK: HeliOps.exe found" }
          else { Write-Error "HeliOps.exe not found"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeliOps-Windows
          path: dist/HeliOps.zip
          retention-days: 30
