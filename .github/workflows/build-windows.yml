name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller
          pip list

      - name: Build Windows exe
        run: python build.py

      - name: Verify build output
        run: |
          echo "=== dist/ contents ==="
          dir dist\
          echo "=== Checking for HeliOps.exe ==="
          if exist dist\HeliOps.exe (echo "OK: HeliOps.exe found") else (echo "ERROR: HeliOps.exe not found")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeliOps-Windows
          path: dist/HeliOps.zip
          retention-days: 30
